apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-auth
  namespace: stump
  labels:
    app.kubernetes.io/name: edge-auth
    app.kubernetes.io/part-of: stump
    stump.nats: "true"
    stump.public: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-auth
        app.kubernetes.io/part-of: stump
        stump.nats: "true"
        stump.public: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: edge-auth
          image: ghcr.io/andriivladyka/thewoodenstump/edge-auth
          envFrom:
            - configMapRef: { name: stump-config }
          env:
            - name: NATS_USER
              value: edge-auth
            - name: NATS_PASSWORD
              valueFrom: { secretKeyRef: { name: nats-edge-auth, key: password } }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: edge-auth
  namespace: stump
spec:
  selector:
    app.kubernetes.io/name: edge-auth
  ports:
    - { name: http, port: 8080, targetPort: http }
