# Lab data reset: drops every service's tables, the NATS streams and the
# rate-limit counters, then restarts the services so they reseed. The
# program refuses to run unless STUMP_ENVIRONMENT is lab. Run it with
#   kubectl -n stump create job --from=cronjob/reset reset-$(date +%s)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reset
  namespace: stump
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reset
  namespace: stump
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reset
  namespace: stump
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reset
subjects:
  - kind: ServiceAccount
    name: reset
    namespace: stump
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reset
  namespace: stump
spec:
  schedule: "0 5 * * 1"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: reset
            app.kubernetes.io/part-of: stump
            stump.db: "true"
            stump.nats: "true"
        spec:
          restartPolicy: Never
          serviceAccountName: reset
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: reset
              image: ghcr.io/andriivladyka/thewoodenstump/reset
              env:
                - name: STUMP_ENVIRONMENT
                  valueFrom: { configMapKeyRef: { name: stump-config, key: STUMP_ENVIRONMENT } }
                - { name: RESTART, value: "edge-auth billing issuer board trust anchor mcp web bot-status bot-releases" }
                - name: PG_BILLING_USER
                  valueFrom: { secretKeyRef: { name: db-billing, key: username } }
                - name: PG_BILLING_PASSWORD
                  valueFrom: { secretKeyRef: { name: db-billing, key: password } }
                - name: PG_ISSUER_USER
                  valueFrom: { secretKeyRef: { name: db-issuer, key: username } }
                - name: PG_ISSUER_PASSWORD
                  valueFrom: { secretKeyRef: { name: db-issuer, key: password } }
                - name: PG_BOARD_USER
                  valueFrom: { secretKeyRef: { name: db-board, key: username } }
                - name: PG_BOARD_PASSWORD
                  valueFrom: { secretKeyRef: { name: db-board, key: password } }
                - name: PG_TRUST_USER
                  valueFrom: { secretKeyRef: { name: db-trust, key: username } }
                - name: PG_TRUST_PASSWORD
                  valueFrom: { secretKeyRef: { name: db-trust, key: password } }
                - name: PG_ANCHOR_USER
                  valueFrom: { secretKeyRef: { name: db-anchor, key: username } }
                - name: PG_ANCHOR_PASSWORD
                  valueFrom: { secretKeyRef: { name: db-anchor, key: password } }
                - name: NATS_ISSUER_PASSWORD
                  valueFrom: { secretKeyRef: { name: nats-issuer, key: password } }
                - name: NATS_BOARD_PASSWORD
                  valueFrom: { secretKeyRef: { name: nats-board, key: password } }
                - name: NATS_EDGE_AUTH_PASSWORD
                  valueFrom: { secretKeyRef: { name: nats-edge-auth, key: password } }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
