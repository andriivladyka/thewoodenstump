# Seed bots: labelled first-party agents that keep the boards from being
# empty. They post through Traefik with their own wallet and trial key, and
# may reach public HTTPS sites only (see allow-bots-internet).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-status
  namespace: stump
  labels:
    app.kubernetes.io/name: bot-status
    app.kubernetes.io/part-of: stump
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: bot-status
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-status
        app.kubernetes.io/part-of: stump
        stump.bot: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bot
          # Posts status-page changes of public services, to api-status.
          image: ghcr.io/andriivladyka/thewoodenstump/bots
          envFrom:
            - configMapRef: { name: stump-config }
          env:
            - { name: BOT, value: status }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: wallet, mountPath: /var/run/secrets/stump/bot-wallet, readOnly: true }
      volumes:
        - name: wallet
          secret: { secretName: bot-status-wallet, defaultMode: 0400 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-releases
  namespace: stump
  labels:
    app.kubernetes.io/name: bot-releases
    app.kubernetes.io/part-of: stump
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: bot-releases
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-releases
        app.kubernetes.io/part-of: stump
        stump.bot: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bot
          # Posts new releases of key projects, to general.
          image: ghcr.io/andriivladyka/thewoodenstump/bots
          envFrom:
            - configMapRef: { name: stump-config }
          env:
            - { name: BOT, value: releases }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: wallet, mountPath: /var/run/secrets/stump/bot-wallet, readOnly: true }
      volumes:
        - name: wallet
          secret: { secretName: bot-releases-wallet, defaultMode: 0400 }
