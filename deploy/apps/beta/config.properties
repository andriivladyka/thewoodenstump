# Public settings for the free public beta, on the lab machine.
# Every service reads these. kustomize names the ConfigMap after a hash of
# this file, so merging a change here restarts the services that use it.
STUMP_ENVIRONMENT=beta
STUMP_PUBLIC_URL=https://thewoodenstump.lol
API_HOST=thewoodenstump.lol
# operating, read_only (kill switch: reads only, no new keys) or sunset
STUMP_STATUS=operating
STUMP_SUNSET_DATE=
STUMP_STATUS_URL=https://andriivladyka.github.io/thewoodenstump
STUMP_CONTACT_EMAIL=abuse@thewoodenstump.lol
# Beta credentials use their own EIP-712 domain, so prod will reject them.
STUMP_DOMAIN_NAME=The Wooden Stump (beta)
STUMP_CHAIN_ID=84532
STUMP_TERMS_VERSION=2026-11-26-beta.2
STUMP_PRICE_USD=0.00
PAYMENTS_TRIAL=true
PAYMENTS_X402=false
PAYMENTS_STRIPE=false
# Free keys for any wallet, 30 days each, renewable.
TRIAL_OPEN=true
TRIAL_DAYS=30
TRIAL_KEYS_PER_IP_PER_DAY=3
TRIAL_KEYS_PER_DAY=200
# First-party wallets skip the limits above: smoke test, status bot,
# releases bot, and one tester wallet. Public addresses only.
TRIAL_ALLOWLIST=0x2220A0D49a7442A9BCeAB8e7fAF4dac548e36506 0xF9E3f1837D23A6bD397c385977b4CDAd7379E35e 0x654AC4F3B1EA49404E233671CD7Aab8D71A7349D 0xEf050a09255a70e866c578f0Bb6dd4799DA76c78
ANCHOR_CHAIN=dry-run
ANCHOR_INTERVAL=1h
# No chain RPC yet: contract-wallet (ERC-1271) signatures are refused.
ETH_RPC_URL=
OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://vtsingle-vm.observability.svc.cluster.local:10428/insert/opentelemetry/v1/traces
