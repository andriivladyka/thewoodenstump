apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - web.yaml
  - routes.yaml
# Pin by digest after each build of mlbrr/thelonetoilet.com (the image
# workflow prints it in its run summary):
#   kustomize edit set image ghcr.io/mlbrr/thelonetoilet.com=ghcr.io/mlbrr/thelonetoilet.com@sha256:...
# Until the first build, the main tag stands in.
images:
  - name: ghcr.io/mlbrr/thelonetoilet.com
    newTag: main
