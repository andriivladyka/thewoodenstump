# thelonetoilet.com arrives through the Cloudflare tunnel on Traefik's
# in-cluster HTTP entry, like thewoodenstump.lol.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: toilet
  namespace: toilet
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`thelonetoilet.com`) || Host(`www.thelonetoilet.com`)
      middlewares:
        - name: client-limits
      services:
        - name: web
          port: 8080
---
# Per-client limits keyed on the address Cloudflare reports, as for stump.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: client-limits
  namespace: toilet
spec:
  chain:
    middlewares:
      - name: client-rate
      - name: client-inflight
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: client-rate
  namespace: toilet
spec:
  rateLimit:
    average: 10
    period: 1s
    burst: 40
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: client-inflight
  namespace: toilet
spec:
  inFlightReq:
    amount: 10
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
