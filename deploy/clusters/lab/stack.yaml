# The lab machine, which runs the public beta. Applied in order:
# controllers (operators, CRDs), then configs that use those CRDs, then the
# services, then the tunnel that makes them public.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./deploy/infra/controllers/lab
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./deploy/infra/configs/lab
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./deploy/apps/beta
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# No health wait: until the tunnel token exists on the host, cloudflared
# waits for its Secret and the rest of the cluster carries on.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tunnel
  namespace: flux-system
spec:
  dependsOn:
    - name: apps
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./deploy/infra/tunnel
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# thelonetoilet.com, a separate static site on the same node. Kept out of
# apps so a failed pull or rollout here never holds up the stump services.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: toilet
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./deploy/apps/toilet
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
