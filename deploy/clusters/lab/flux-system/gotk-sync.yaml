# The repo is public, so Flux reads it over HTTPS with no token or deploy key.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/andriivladyka/thewoodenstump
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/clusters/lab
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
