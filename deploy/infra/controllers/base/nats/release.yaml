apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nats
  namespace: messaging
spec:
  interval: 12h
  url: https://nats-io.github.io/k8s/helm/charts/
---
# One NATS server with JetStream (streams and KV) on local disk.
# Each service logs in as itself; passwords come from the nats-users Secret
# that the host creates. Only namespaces a NetworkPolicy allows can connect.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
  namespace: messaging
spec:
  interval: 1h
  chart:
    spec:
      chart: nats
      version: 2.15.3
      sourceRef:
        kind: HelmRepository
        name: nats
  values:
    config:
      cluster:
        enabled: false
      jetstream:
        enabled: true
        fileStore:
          pvc:
            size: 5Gi
            storageClassName: local-path
      monitor:
        enabled: true
      merge:
        authorization:
          users:
          - user: edge-auth
            password: << $NATS_EDGE_AUTH >>
            permissions:
              publish: { allow: ["$JS.API.>", "$KV.edge_auth.>", "_INBOX.>"] }
              subscribe: { allow: [">"] }
          - user: issuer
            password: << $NATS_ISSUER >>
            permissions:
              publish: { allow: ["stump.issuer.>", "$JS.API.>", "_INBOX.>"] }
              subscribe: { allow: [">"] }
          - user: board
            password: << $NATS_BOARD >>
            permissions:
              publish: { allow: ["stump.board.>", "$JS.API.>", "_INBOX.>"] }
              subscribe: { allow: [">"] }
          - user: trust
            password: << $NATS_TRUST >>
            permissions:
              publish: { allow: ["stump.trust.>", "_INBOX.>"] }
              subscribe: { allow: [">"] }
          - user: anchor
            password: << $NATS_ANCHOR >>
            permissions:
              publish: { allow: ["$JS.API.>", "$JS.ACK.>", "_INBOX.>"] }
              subscribe: { allow: [">"] }
    container:
      env:
        NATS_EDGE_AUTH:
          valueFrom:
            secretKeyRef: { name: nats-users, key: edge-auth }
        NATS_ISSUER:
          valueFrom:
            secretKeyRef: { name: nats-users, key: issuer }
        NATS_BOARD:
          valueFrom:
            secretKeyRef: { name: nats-users, key: board }
        NATS_TRUST:
          valueFrom:
            secretKeyRef: { name: nats-users, key: trust }
        NATS_ANCHOR:
          valueFrom:
            secretKeyRef: { name: nats-users, key: anchor }
      merge:
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 512Mi }
        securityContext: &restricted
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
    reloader:
      merge:
        securityContext: *restricted
    promExporter:
      enabled: true
      merge:
        securityContext: *restricted
    podTemplate:
      merge:
        spec:
          securityContext:
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
    natsBox:
      enabled: false
