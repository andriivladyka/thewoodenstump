apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nats
  namespace: messaging
spec:
  interval: 12h
  url: https://nats-io.github.io/k8s/helm/charts/
---
# One NATS server with JetStream (streams and KV) on local disk.
# Only namespaces that a NetworkPolicy allows can reach it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
  namespace: messaging
spec:
  interval: 1h
  chart:
    spec:
      chart: nats
      version: 2.15.3
      sourceRef:
        kind: HelmRepository
        name: nats
  values:
    config:
      cluster:
        enabled: false
      jetstream:
        enabled: true
        fileStore:
          pvc:
            size: 5Gi
            storageClassName: local-path
      monitor:
        enabled: true
    container:
      merge:
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 512Mi }
        securityContext: &restricted
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
    reloader:
      merge:
        securityContext: *restricted
    promExporter:
      enabled: true
      merge:
        securityContext: *restricted
    podTemplate:
      merge:
        spec:
          securityContext:
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
    natsBox:
      enabled: false
