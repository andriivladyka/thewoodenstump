apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nats
  namespace: messaging
spec:
  interval: 12h
  url: https://nats-io.github.io/k8s/helm/charts/
---
# One NATS server with JetStream (streams and KV) on local disk.
# Each service logs in as itself; passwords come from the nats-users Secret
# that the host creates. Only namespaces a NetworkPolicy allows can connect.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
  namespace: messaging
spec:
  interval: 1h
  chart:
    spec:
      chart: nats
      version: 2.15.3
      sourceRef:
        kind: HelmRepository
        name: nats
  values:
    config:
      cluster:
        enabled: false
      jetstream:
        enabled: true
        fileStore:
          pvc:
            size: 5Gi
            storageClassName: local-path
      monitor:
        enabled: true
      # Each user may publish only its own events and manage only its own
      # stream (or KV bucket), and receives replies only on its own inbox
      # prefix (_INBOX_<user>, set by the client). Nothing else is allowed:
      # no user can read, change or delete another service's data.
      merge:
        authorization:
          users:
          - user: edge-auth
            password: << $NATS_EDGE_AUTH >>
            permissions:
              publish:
                allow:
                - "$KV.edge_auth.>"
                - "$JS.API.STREAM.*.KV_edge_auth"
                - "$JS.API.STREAM.MSG.GET.KV_edge_auth"
                - "$JS.API.DIRECT.GET.KV_edge_auth.>"
                - "$JS.API.INFO" # read-only account totals; creating a KV bucket asks for them
              subscribe: { allow: ["_INBOX_edge-auth.>"] }
          - user: issuer
            password: << $NATS_ISSUER >>
            permissions:
              publish:
                allow:
                - "stump.issuer.>"
                - "$JS.API.STREAM.*.CREDENTIALS"
              subscribe: { allow: ["_INBOX_issuer.>"] }
          - user: board
            password: << $NATS_BOARD >>
            permissions:
              publish:
                allow:
                - "stump.board.>"
                - "$JS.API.STREAM.*.BOARD"
              subscribe: { allow: ["_INBOX_board.>", "stump.board.message.posted.*"] }
          - user: trust
            password: << $NATS_TRUST >>
            permissions:
              publish: { allow: ["stump.trust.>"] }
              subscribe: { allow: ["_INBOX_trust.>"] }
          # anchor reads the issuer's stream through its own durable
          # consumer and cannot change the stream itself.
          - user: anchor
            password: << $NATS_ANCHOR >>
            permissions:
              publish:
                allow:
                - "$JS.API.CONSUMER.CREATE.CREDENTIALS.anchor.>"
                - "$JS.API.CONSUMER.DURABLE.CREATE.CREDENTIALS.anchor"
                - "$JS.API.CONSUMER.INFO.CREDENTIALS.anchor"
                - "$JS.API.CONSUMER.MSG.NEXT.CREDENTIALS.anchor"
                - "$JS.ACK.CREDENTIALS.anchor.>"
              subscribe: { allow: ["_INBOX_anchor.>"] }
    container:
      env:
        NATS_EDGE_AUTH:
          valueFrom:
            secretKeyRef: { name: nats-users, key: edge-auth }
        NATS_ISSUER:
          valueFrom:
            secretKeyRef: { name: nats-users, key: issuer }
        NATS_BOARD:
          valueFrom:
            secretKeyRef: { name: nats-users, key: board }
        NATS_TRUST:
          valueFrom:
            secretKeyRef: { name: nats-users, key: trust }
        NATS_ANCHOR:
          valueFrom:
            secretKeyRef: { name: nats-users, key: anchor }
      merge:
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 512Mi }
        securityContext: &restricted
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
    reloader:
      merge:
        securityContext: *restricted
    promExporter:
      enabled: true
      merge:
        securityContext: *restricted
    podTemplate:
      merge:
        spec:
          securityContext:
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
    natsBox:
      enabled: false
