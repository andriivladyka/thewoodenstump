apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoriametrics
  namespace: observability
spec:
  interval: 12h
  url: https://victoriametrics.github.io/helm-charts/
---
# Metrics: VictoriaMetrics single node, vmagent, node-exporter, kube-state-metrics.
# Logs: VictoriaLogs single node, with vlagent collecting pod logs.
# Traces: VictoriaTraces single node; services and Traefik send OTLP to it.
# Grafana with all three as datasources.
# Alerts: vmalert evaluates the VMRules in infra/configs/base/alerts and
# Alertmanager pushes them to ntfy; the topic URLs are host secrets
# (observability/alert-ntfy), never in git.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-stack
  namespace: observability
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.99.0
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Short names: vmsingle-vm, vlsingle-vm, vmagent-vm, vm-grafana...
    fullnameOverride: vm
    defaultRules:
      enabled: false
    alertmanager:
      enabled: true
      spec:
        secrets: [alert-ntfy]
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
      config:
        route:
          receiver: warning
          group_by: [alertname]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - matchers: ['severity="critical"']
              receiver: critical
              repeat_interval: 2h
        receivers:
          - name: warning
            webhook_configs:
              - url_file: /etc/vm/secrets/alert-ntfy/url-warning
                send_resolved: true
          - name: critical
            webhook_configs:
              - url_file: /etc/vm/secrets/alert-ntfy/url-critical
                send_resolved: true
    vmalert:
      enabled: true
      spec:
        evaluationInterval: 1m
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 256Mi }
    vmsingle:
      spec:
        retentionPeriod: 30d
        storage:
          storageClassName: local-path
          resources:
            requests:
              storage: 10Gi
        resources:
          requests: { cpu: 50m, memory: 256Mi }
          limits: { memory: 1Gi }
    vmagent:
      spec:
        resources:
          requests: { cpu: 20m, memory: 64Mi }
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: 14d
        storage:
          storageClassName: local-path
          resources:
            requests:
              storage: 10Gi
        resources:
          requests: { cpu: 20m, memory: 128Mi }
          limits: { memory: 1Gi }
    vtsingle:
      enabled: true
      spec:
        retentionPeriod: 7d
        storage:
          storageClassName: local-path
          resources:
            requests:
              storage: 5Gi
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 512Mi }
    vlagent:
      enabled: true
      rbac:
        namespaced: false
      spec:
        k8sCollector:
          enabled: true
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      plugins:
        - victoriametrics-metrics-datasource
        - victoriametrics-logs-datasource
      resources:
        requests: { cpu: 20m, memory: 128Mi }
    # k3s runs these inside its own process; their metrics are not exposed.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
