# privileged: node-exporter and the log collector read the host.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
---
# Ingress from other namespaces is denied unless a policy allows it.
# Allowed: this namespace, the node itself (API server webhooks, kubelet),
# and metric scraping from observability.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-ingress
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.42.0.0/16]
