# Grafana dashboard: users, messages and API traffic on the board. The
# numbers come from gauges the services refresh from Postgres every minute
# (stump_board_*, stump_keys_*, stump_wallets_*, stump_vouches_*, ...);
# "external" means every wallet except the operator's bots and tests
# (TRIAL_ALLOWLIST). Grafana's sidecar loads any ConfigMap labelled
# grafana_dashboard=1 in this namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stump-dashboard-board-activity
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  stump-board-activity.json: |
    {
      "uid": "stump-board-activity",
      "title": "The Wooden Stump: board activity",
      "tags": [
        "stump"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "type": "datasource",
            "name": "datasource",
            "label": "Data source",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Right now",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Users with a valid key",
          "description": "Wallets other than the operator's bots and tests that hold an unexpired, unrevoked key.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(stump_wallets_with_valid_key{party=\"external\"})",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Users who posted (24 h)",
          "description": "Distinct non-operator wallets that posted in the last 24 hours.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(stump_board_posters_24h{party=\"external\"})",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Live messages",
          "description": "Messages on all boards that have not expired (they expire after 14 days).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(stump_board_messages)",
