# Tests every change (including govulncheck); on main, builds one image per
# service, pushes it to GHCR, signs it with cosign (keyless) and scans it
# with Trivy, then verifies the signatures and pins the new digests for the beta,
# which Flux deploys.
# GitHub-hosted runners only: never attach a self-hosted runner to this
# public repo.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["deploy/**", "tools/**", "**.md"]
  pull_request:
    paths-ignore: ["deploy/**", "tools/**", "**.md"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: govulncheck (fails on vulnerabilities the code can reach)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  images:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing through GitHub's OIDC token
      security-events: write # scan results go to the repo's Security tab
    strategy:
      matrix:
        service: [edge-auth, billing, issuer, board, trust, anchor, mcp, web, smoke, bots, mcp-local]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # mcp-local runs on agents' own machines, not in the cluster: it also
      # gets its version and latest tags, and the label the official MCP
      # Registry checks to tie the image to io.github.<owner>/thewoodenstump.
      - id: meta
        name: Tags and labels
        run: |
          img="ghcr.io/${{ github.repository }}/${{ matrix.service }}"
          tags="$img:sha-${{ github.sha }}"
          label=""
          if [ "${{ matrix.service }}" = mcp-local ]; then
            v=$(sed -n 's/^var version = "\(.*\)"$/\1/p' services/mcp-local/main.go)
            tags="$tags,$img:$v,$img:latest"
            label="io.modelcontextprotocol.server.name=io.github.${{ github.repository_owner }}/thewoodenstump"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            ${{ steps.meta.outputs.label }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - uses: sigstore/cosign-installer@v4.1.4
      - name: Sign the image (keyless, recorded in the public Rekor log)
        run: cosign sign --yes "ghcr.io/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}"
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: image-${{ matrix.service }}
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
          skip-setup-trivy: true

  deploy-beta:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    concurrency: deploy-beta
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.4
      - name: Verify signatures and pin image digests for the beta
        env:
          REPO: ghcr.io/${{ github.repository }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
        run: |
          cd deploy/apps/beta
          for s in edge-auth billing issuer board trust anchor mcp web smoke bots; do
            digest=$(docker buildx imagetools inspect "$REPO/$s:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
            cosign verify "$REPO/$s@$digest" --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            kustomize edit set image "$REPO/$s=$REPO/$s@$digest"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "beta: deploy ${GITHUB_SHA::7}" || exit 0
          git pull -q --rebase origin main
          git push -q origin HEAD:main
