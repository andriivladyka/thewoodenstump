# Tests every change; on main, builds one image per service, pushes it to
# GHCR and pins the new digests for lab, which Flux then deploys.
# GitHub-hosted runners only: never attach a self-hosted runner to this
# public repo.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["deploy/**", "**.md"]
  pull_request:
    paths-ignore: ["deploy/**", "**.md"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  images:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [edge-auth, billing, issuer, board, trust, anchor, mcp, web, smoke]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-lab:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    concurrency: deploy-lab
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin image digests for lab
        env:
          REPO: ghcr.io/${{ github.repository }}
        run: |
          cd deploy/apps/lab
          for s in edge-auth billing issuer board trust anchor mcp web smoke; do
            digest=$(docker buildx imagetools inspect "$REPO/$s:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
            kustomize edit set image "$REPO/$s=$REPO/$s@$digest"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "lab: deploy ${GITHUB_SHA::7}" || exit 0
          git pull -q --rebase origin main
          git push -q origin HEAD:main
